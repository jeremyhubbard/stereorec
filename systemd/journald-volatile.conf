# Keep the systemd journal RAM-only (tmpfs), never the SD card -- this repo already avoids
# writing the app's own logs to the SD card (see README_pi4.md's "Reducing SD-card wear");
# without this, a system with persistent journaling enabled would still write journald's copy
# of every log line (including StandardOutput/StandardError=journal from stereorec.service)
# to flash. Cleared on every reboot/power loss, same tradeoff as fallback_log_dir.
#
# Deploy as a drop-in, not by editing journald.conf directly, so it survives an OS upgrade:
#   sudo cp systemd/journald-volatile.conf /etc/systemd/journald.conf.d/journald-volatile.conf
#   sudo systemctl restart systemd-journald
#
# RuntimeMaxUse bounds how much RAM the in-memory journal can consume -- 50M comfortably fits
# a short LIBCAMERA_LOG_LEVELS=*:DEBUG capture (see the camera-stall troubleshooting section)
# without being a meaningful chunk of RAM even on the smallest Pi 4 variant. Raise it temporarily
# if a debug capture needs more room.
[Journal]
Storage=volatile
RuntimeMaxUse=50M
